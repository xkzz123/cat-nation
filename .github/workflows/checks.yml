name: Gameplay checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix game --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm run test:game -- --silent
      - run: npx --yes @fission-ai/openspec@2.0.0 validate complete-gameplay-loop --strict
      - run: git diff --check
